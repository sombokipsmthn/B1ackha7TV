<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="lake-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="40%" stop-color="#2d3a4f"/>
      <stop offset="60%" stop-color="#3d4a5f"/>
      <stop offset="100%" stop-color="#1a252f"/>
    </linearGradient>
    <linearGradient id="lake-water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1a2a"/>
      <stop offset="50%" stop-color="#15253a"/>
      <stop offset="100%" stop-color="#0a1520"/>
    </linearGradient>
    <radialGradient id="sunset-glow" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="rgba(255, 100, 50, 0.15)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#lake-sky)"/>
  <ellipse cx="960" cy="380" rx="800" ry="300" fill="url(#sunset-glow)"/>

  <!-- Distant mountains -->
  <path d="M0,600 Q320,400 640,500 Q960,400 1280,500 Q1600,400 1920,600 L1920,1080 L0,1080 Z" fill="#121a24" opacity="0.7"/>

  <!-- Closer mountains -->
  <path d="M0,700 Q480,500 960,620 Q1440,500 1920,700 L1920,1080 L0,1080 Z" fill="#18202c"/>

  <!-- Lake surface -->
  <ellipse cx="960" cy="1400" rx="1400" ry="500" fill="url(#lake-water)"/>

  <!-- Reflections in water -->
  <ellipse cx="960" cy="1000" rx="600" ry="100" fill="rgba(255, 100, 50, 0.08)"/>

  <!-- Trees silhouette -->
  <g fill="#0a1015">
    <path d="M200,800 L220,650 L240,800 Z"/>
    <path d="M300,820 L325,680 L350,820 Z"/>
    <path d="M420,810 L445,670 L470,810 Z"/>
    <path d="M1500,810 L1525,670 L1550,810 Z"/>
    <path d="M1620,820 L1645,680 L1670,820 Z"/>
    <path d="M1740,800 L1765,650 L1790,800 Z"/>
  </g>

  <!-- Gentle ripples -->
  <g stroke="rgba(255,255,255,0.02)" stroke-width="1" fill="none">
    <ellipse cx="960" cy="950" rx="200" ry="20"/>
    <ellipse cx="960" cy="980" rx="300" ry="30"/>
    <ellipse cx="960" cy="1010" rx="400" ry="40"/>
  </g>
</svg>