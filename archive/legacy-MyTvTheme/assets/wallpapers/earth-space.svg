<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="space-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="60%" stop-color="#0a0e18"/>
      <stop offset="100%" stop-color="#03050a"/>
    </radialGradient>
    <radialGradient id="earth-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(30, 100, 200, 0.3)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="sun-glow" cx="80%" cy="20%" r="30%">
      <stop offset="0%" stop-color="rgba(255, 220, 100, 0.2)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#space-bg)"/>
  <ellipse cx="960" cy="540" rx="600" ry="400" fill="url(#earth-glow)"/>
  <ellipse cx="1536" cy="216" rx="400" ry="300" fill="url(#sun-glow)"/>

  <!-- Earth -->
  <circle cx="960" cy="540" r="280" fill="none">
    <animate attributeName="r" values="280;282;280" dur="20s" repeatCount="indefinite"/>
  </circle>

  <!-- Earth texture suggestion -->
  <ellipse cx="960" cy="540" rx="280" ry="280" fill="url(#earth-texture)"/>

  <!-- Atmosphere -->
  <circle cx="960" cy="540" r="295" fill="none" stroke="rgba(100, 180, 255, 0.3)" stroke-width="3" opacity="0.5"/>

  <!-- Stars -->
  <g fill="white">
    <circle cx="100" cy="100" r="0.5" opacity="0.8"/>
    <circle cx="300" cy="80" r="1" opacity="0.6"/>
    <circle cx="500" cy="200" r="0.5" opacity="0.9"/>
    <circle cx="700" cy="50" r="1" opacity="0.7"/>
    <circle cx="900" cy="150" r="0.5" opacity="0.8"/>
    <circle cx="1100" cy="80" r="1" opacity="0.6"/>
    <circle cx="1300" cy="180" r="0.5" opacity="0.9"/>
    <circle cx="1500" cy="120" r="1" opacity="0.7"/>
    <circle cx="1700" cy="200" r="0.5" opacity="0.8"/>
    <circle cx="200" cy="300" r="1" opacity="0.5"/>
    <circle cx="400" cy="400" r="0.5" opacity="0.8"/>
    <circle cx="600" cy="350" r="1" opacity="0.6"/>
    <circle cx="800" cy="450" r="0.5" opacity="0.7"/>
    <circle cx="1000" cy="380" r="1" opacity="0.5"/>
    <circle cx="1200" cy="420" r="0.5" opacity="0.9"/>
    <circle cx="1400" cy="360" r="1" opacity="0.6"/>
    <circle cx="1600" cy="400" r="0.5" opacity="0.8"/>
    <circle cx="1800" cy="340" r="1" opacity="0.5"/>
    <circle cx="100" cy="900" r="0.5" opacity="0.7"/>
    <circle cx="350" cy="950" r="1" opacity="0.6"/>
    <circle cx="600" cy="880" r="0.5" opacity="0.8"/>
    <circle cx="850" cy="920" r="1" opacity="0.5"/>
    <circle cx="1100" cy="890" r="0.5" opacity="0.9"/>
    <circle cx="1350" cy="940" r="1" opacity="0.7"/>
    <circle cx="1600" cy="900" r="0.5" opacity="0.8"/>
    <circle cx="1850" cy="880" r="1" opacity="0.6"/>
  </g>

  <!-- Moon -->
  <circle cx="300" cy="200" r="40" fill="#e8e8e8" opacity="0.9"/>
</svg>