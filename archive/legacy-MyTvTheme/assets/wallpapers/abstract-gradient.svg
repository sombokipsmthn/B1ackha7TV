<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="purple-core" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3d1b4d"/>
      <stop offset="50%" stop-color="#2d1b3d"/>
      <stop offset="100%" stop-color="#1a1a3a"/>
    </radialGradient>
    <radialGradient id="blue-core" cx="70%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="pink-core" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="rgba(139, 92, 246, 0.2)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.3)"/>
      <stop offset="50%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.3)"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#purple-core)"/>

  <!-- Gradient blobs -->
  <ellipse cx="1344" cy="756" rx="600" ry="400" fill="url(#blue-core)" filter="url(#blur)"/>
  <ellipse cx="960" cy="540" rx="500" ry="350" fill="url(#pink-core)" filter="url(#blur)"/>

  <!-- Subtle geometric patterns -->
  <g fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1">
    <circle cx="960" cy="540" r="100"/>
    <circle cx="960" cy="540" r="200"/>
    <circle cx="960" cy="540" r="300"/>
    <circle cx="960" cy="540" r="400"/>
  </g>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>