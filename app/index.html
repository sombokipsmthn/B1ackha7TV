<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My TV</title>
  <link rel="stylesheet" href="css/cinematic.css">
  <link rel="stylesheet" href="css/pages.css">
  <script src="main.js" type="module" defer></script>
</head>
<body>
  <div id="wallpaper" aria-hidden="true"></div>
  <div id="root"></div>
  <script type="module">
    import React from 'https://esm.sh/react@18';
    import ReactDOM from 'https://esm.sh/react-dom@18/client';
    import { BrowserRouter, Routes, Route, useParams, useLocation } from 'https://esm.sh/react-router-dom@6';
    import HomePage from './pages/home.js';
    import AppsPage from './pages/apps.js';
    import GamesPage from './pages/games.js';
    import RecentPage from './pages/recent.js';
    import SearchPage from './pages/search.js';
    import SettingsPage from './pages/settings.js';

    // 路由组件
    function AppRouter() {
      const location = useLocation();
      const activeSection = location.pathname.replace(/^\//, '') || 'home';

      return (
        <div className="app-container">
          <Sidebar active={activeSection} />
          <main className="main-content">
            <Routes>
              <Route path="/" element={<HomePage />} />
              <Route path="/home" element={<HomePage />} />
              <Route path="/apps" element={<AppsPage />} />
              <Route path="/games" element={<GamesPage />} />
              <Route path="/recent" element={<RecentPage />} />
              <Route path="/search" element={<SearchPage />} />
              <Route path="/settings" element={<SettingsPage />} />
              <Route path="/live-tv" element={<TVInputView />} />
            </Routes>
          </main>
        </div>
      );
    }

    // 侧边栏
    function Sidebar({ active }) {
      const navigate = useNavigate();
      const sections = [
        { id: 'home', label: 'Home', icon: 'home' },
        { id: 'search', label: 'Search', icon: 'search' },
        { id: 'live-tv', label: 'Live TV', icon: 'tv' },
        { id: 'apps', label: 'Apps', icon: 'grid-2x2' },
        { id: 'gaming', label: 'Gaming', icon: 'gamepad-2' },
        { id: 'settings', label: 'Settings', icon: 'settings' },
      ];

      return (
        <nav className="sidebar" role="navigation" aria-label="Main navigation">
          <ul className="sidebar-items">
            {sections.map(section => (
              <li key={section.id}>
                <button
                  className={`sidebar-item ${active === section.id ? 'active' : ''}`}
                  onClick={() => navigate(`/${section.id}`)}
                  aria-label={section.label}
                >
                  <span className="sidebar-icon">{section.icon}</span>
                  <span className="sidebar-label">{section.label}</span>
                </button>
              </li>
            ))}
          </ul>
        </nav>
      );
    }

    // 品牌组件
    function Brand() {
      return (
        <div className="brand">
          <span className="mark" id="launcher-mark">MT</span>
          <span id="launcher-title">My TV</span>
        </div>
      );
    }

    // 时钟组件
    function Clock() {
      return (
        <div className="clock-group">
          <time id="clock" aria-live="polite"></time>
          <span id="date"></span>
        </div>
      );
    }

    // TV 输入视图
    function TVInputView() {
      return (
        <div className="page live-tv-page">
          <h1>Live TV</h1>
          <p>Watch live TV and channels.</p>
        </div>
      );
    }

    // 渲染应用
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <BrowserRouter>
        <AppRouter />
      </BrowserRouter>
    );

    // 暴露全局 API
    window.b1ackha7tv = { React, ReactDOM, BrowserRouter };
  </script>
</body>
</html>
