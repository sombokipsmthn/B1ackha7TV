# Project type [web_app, test_runner]
project_type: web_app

# Default profile, Tizen API version
profile: tv-samsung
api_version: "10.0"

# Build type [Debug/ Release/ Test]
build_type: Debug

# Output name for application
output_name: Kipsmthn

# Output path for build
output_path: ""

# Enable size optimization of wgt for web workspace
opt: false

# Signing profile to be used for Tizen package signing
# If value is empty: "", active signing profile will be used
# Else If value is ".", default signing profile will be used
signing_profile: ""

# list of certs in web project (.trust-anchor)
trust_anchor: []

# list of files in web project (.html,.css etc) and resources
files:
  - css/cinematic.css
  - lib/utils.js
  - components/ui/index.js
  - icon.png
  - index.html
  - main.js
  - photo-library.js
  - audio-controller.js
  - motion-system.js
  - tizen-service.js
  - icon-resolver.js
  - assets/lucide.min.js
  - assets/VWMK740-01059.jpg
  - assets/audio/navigation.wav
  - assets/audio/selection.wav
  - assets/audio/back.wav
  - assets/audio/error.wav
  - assets/audio/startup.wav
  - assets/photos/desert-cinema.jpg
  - assets/photos/evening-sky.jpg
  - assets/photos/lake-dusk.jpg
  - assets/photos/live-music.jpg
  - assets/photos/moody-forest.jpg
  - assets/photos/night-sky.jpg
  - assets/photos/nocturnal-city.jpg
  - assets/photos/photography.jpg
  - assets/photos/quiet-architecture.jpg
  - assets/photos/studio-music.jpg
  - assets/photos/twilight-mountains.jpg
  - assets/photos/video-camera.jpg

# list of files to exclude based on the matched patterns
excludes:
  - Build/*
  - Debug/*
  - Directory.Build.targets
  - Release/*
  - Test/*
  - \.Build/.*
  - \.buildResult/.*
  - \.csproj
  - \.externalToolBuilders/.*
  - \.gn
  - \.obj/.*
  - \.package/.*
  - \.project
  - \.rds_delta
  - \.sdk_delta.info
  - \.settings/.*
  - \.sign/.*
  - \.tizen-ui-builder-tool.xml
  - \.tproject
  - \.wgt
  - tizen_web_project.yaml
  - webUnitTest/*

# project dependencies
deps: []